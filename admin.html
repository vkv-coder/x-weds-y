<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X weds Y - Admin (Demo)</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7A1230">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- ========== ADMIN LOGIN ========== -->
<div id="admin-login-screen">
  <div class="login-box">
    <div class="logo-area">
      <div class="logo-icon">🔐</div>
      <h1>Host Admin</h1>
      <div class="subtitle">🎬 X weds Y (Live Demo)</div>
    </div>
    <div class="form-group">
      <label>Admin PIN</label>
      <input type="password" id="admin-pin" placeholder="try: demo2027" />
    </div>
    <button class="btn-primary" onclick="adminLogin()">Log In</button>
    <div class="error-msg" id="admin-login-error"></div>
    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted);">
      Demo PIN: <b>demo2027</b> - feel free to add/edit/delete, this is sample data.
    </p>
    <p style="text-align:center;margin-top:10px;">
      <a href="index.html" style="color:var(--primary);font-size:13px;">&larr; Back to guest app</a>
    </p>
  </div>
  <div class="app-footer">
    <p class="support-line">Questions? <a href="mailto:info.anyapps@gmail.com">info.anyapps@gmail.com</a></p>
    <p class="powered-by">Powered by <a href="https://anyapps.in" target="_blank" rel="noopener" class="anyapps-badge">Any<span class="accent">Apps</span>.in</a></p>
  </div>
</div>

<!-- ========== ADMIN APP ========== -->
<div id="admin-main-screen" style="display:none;">
  <div class="app-header-sticky">
    <div class="topbar">
      <span class="app-title">🔐 Host Admin</span>
      <div class="topbar-right">
        <a href="index.html" class="home-btn" style="text-decoration:none;color:#fff;">Guest App</a>
        <button class="btn-logout" onclick="adminLogout()">Log Out</button>
      </div>
    </div>
    <div class="nav-tabs" id="admin-nav-tabs"></div>
  </div>
  <div class="page-content" id="admin-page-content"></div>
  <div class="app-footer">
    <p class="support-line">Questions? <a href="mailto:info.anyapps@gmail.com">info.anyapps@gmail.com</a></p>
    <p class="powered-by">Powered by <a href="https://anyapps.in" target="_blank" rel="noopener" class="anyapps-badge">Any<span class="accent">Apps</span>.in</a></p>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box" id="modal-box"></div>
</div>
<div id="toast" class="toast"></div>

<script src="js/config.js"></script>
<script src="js/admin.js"></script>
<script>
document.getElementById('admin-pin').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') adminLogin();
});
</script>
</body>
</html>
